# Optional Lovelace dashboard: "Orka & Hitaveita"
# -----------------------------------------------------------------------------
# Register as a YAML-mode dashboard (does NOT touch your existing UI dashboards).
# In configuration.yaml:
#
#   lovelace:
#     mode: storage           # keep your existing UI dashboards
#     dashboards:
#       orka-hitaveita:        # url slug MUST contain a hyphen
#         mode: yaml
#         title: "Orka & Hitaveita"
#         icon: mdi:transmission-tower
#         show_in_sidebar: true
#         filename: dashboards/orka.yaml
#
# Electricity entities below assume the HomeWizard integration's defaults
# (sensor.p1_meter_*). Adjust to your own entity_ids if they differ.
# -----------------------------------------------------------------------------
title: Orka & Hitaveita
views:
  - title: Yfirlit
    path: yfirlit
    icon: mdi:gauge
    cards:
      # --- Averages -------------------------------------------------------
      # Two rows, same metrics over two windows. The PERIOD is the row heading
      # and the tile names stay short on purpose: three statistic cards across
      # leaves room for roughly six characters on a phone, so a name like
      # "Bakrás 30 d" truncates to "Bakrá…" and the two windows become
      # indistinguishable. Needs `state_class: measurement` on the temperatures;
      # the ΔT tiles need sensor.hitaveita_delta_t from the optional
      # packages/hitaveita_monitor.yaml - drop them if you do not run it.
      # Statistics only accrue once enabled; see docs/AVERAGING.md for how to
      # backfill them from recorder history you already have.
      - type: markdown
        content: >-
          ### Meðaltöl


          A spot reading says little - the return temperature swings ~15 °C over
          a day. **ΔT** (supply − return) is the best number for comparing with
          other houses; the supply temperature is set by the utility.
      - type: markdown
        content: "**Last 30 days**"
      - type: horizontal-stack
        cards:
          - type: statistic
            entity: sensor.hitaveita_bakrasarhiti
            stat_type: mean
            name: Bakrás
            period:
              rolling_window:
                duration:
                  days: 30
          - type: statistic
            entity: sensor.hitaveita_framrasarhiti
            stat_type: mean
            name: Framrás
            period:
              rolling_window:
                duration:
                  days: 30
          - type: statistic
            entity: sensor.hitaveita_delta_t
            stat_type: mean
            name: ΔT
            period:
              rolling_window:
                duration:
                  days: 30
      - type: markdown
        content: "**Last 365 days**"
      - type: horizontal-stack
        cards:
          - type: statistic
            entity: sensor.hitaveita_bakrasarhiti
            stat_type: mean
            name: Bakrás
            period:
              rolling_window:
                duration:
                  days: 365
          - type: statistic
            entity: sensor.hitaveita_framrasarhiti
            stat_type: mean
            name: Framrás
            period:
              rolling_window:
                duration:
                  days: 365
          - type: statistic
            entity: sensor.hitaveita_delta_t
            stat_type: mean
            name: ΔT
            period:
              rolling_window:
                duration:
                  days: 365
      - type: statistics-graph
        title: Framrás / bakrás - daily mean
        entities:
          - sensor.hitaveita_framrasarhiti
          - sensor.hitaveita_bakrasarhiti
        days_to_show: 365
        period: day
        stat_types:
          - mean
          - min
          - max

      - type: entities
        title: Hitaveita
        state_color: true
        entities:
          - entity: sensor.hitaveita_rummal
            name: Rúmmál (alls)
          - entity: sensor.hitaveita_rummal_manudur
            name: Rúmmál (mánuður)
          - entity: sensor.hitaveita_rennsli
            name: Rennsli
          - entity: sensor.hitaveita_framrasarhiti
            name: Framrásarhiti
          - entity: sensor.hitaveita_bakrasarhiti
            name: Bakrásarhiti
          - entity: sensor.hitaveita_orka
            name: Orka
          - entity: sensor.hitaveita_kostnadur_manudur
            name: Kostnaður (mánuður)
          - entity: sensor.hitaveita_kostnadur_uppsafnadur
            name: Kostnaður (alls)
          - entity: input_number.hitaveita_verd_per_m3
            name: Verð (ISK/m³)

      - type: entities
        title: Rafmagn
        state_color: true
        entities:
          - entity: sensor.p1_meter_power
            name: Afl núna
          - entity: sensor.p1_meter_energy_import
            name: Orkunotkun (alls)
          - entity: sensor.p1_meter_voltage_phase_1
            name: Spenna
          - entity: sensor.p1_meter_current
            name: Straumur
          - entity: sensor.p1_meter_energy_import_cost
            name: Kostnaður

      - type: gauge
        name: Afl núna
        entity: sensor.p1_meter_power
        unit: W
        min: 0
        max: 9000
        severity:
          green: 0
          yellow: 4000
          red: 7000

      - type: gauge
        name: Hitaveita rennsli
        entity: sensor.hitaveita_rennsli
        unit: L/min
        min: 0
        max: 20

      - type: history-graph
        title: Hitaveita hiti (24 klst)
        hours_to_show: 24
        entities:
          - sensor.hitaveita_framrasarhiti
          - sensor.hitaveita_bakrasarhiti
